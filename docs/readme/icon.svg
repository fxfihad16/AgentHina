<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Agent Hina mark for the docs: a lavender "H" on the deep lavender-navy of the launcher icon.
       (The app icon itself is Hina's face: drawable-xxxhdpi/ic_launcher_foreground.png.) -->
  <defs>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#7C6CF0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#1B1730"/>
  <!-- H: two bars + crossbar, rounded ends -->
  <rect x="150" y="150" width="52" height="212" rx="26" fill="url(#h)"/>
  <rect x="310" y="150" width="52" height="212" rx="26" fill="url(#h)"/>
  <rect x="150" y="230" width="212" height="52" rx="26" fill="url(#h)"/>
  <!-- sparkle -->
  <path fill="#DCD6FF" d="M400,104 L409,133 L438,142 L409,151 L400,180 L391,151 L362,142 L391,133 Z"/>
</svg>
